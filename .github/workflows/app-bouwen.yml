name: App bouwen

# Bouwt de Android-app bij elke wijziging aan app/ en levert de APK als artefact
# (te downloaden onder Actions › run › Artifacts) en, bij een tag v*, als release.
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", ".github/workflows/app-bouwen.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK bouwen
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Versie bepalen
        id: v
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "versie=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "trajectcontrole-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: trajectcontrole-${{ steps.v.outputs.versie }}
          path: trajectcontrole-${{ steps.v.outputs.versie }}.apk
      - name: Release (laatste APK)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versie }}
        run: |
          gh release delete "app-laatste" --yes --cleanup-tag 2>/dev/null || true
          gh release create "app-laatste" "trajectcontrole-$V.apk" --title "App $V (laatste build)" \
            --notes "Automatisch gebouwd uit main ($GITHUB_SHA). Installeer via UnknownAuto." --latest
