name: App bouwen

# Bouwt de Android-app bij elke wijziging aan app/ en levert de APK als artefact
# (te downloaden onder Actions › run › Artifacts) en, bij een tag v*, als release.
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", "CHANGELOG.md", ".github/workflows/app-bouwen.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Release notes aanwezig?
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # sectie "## <versie> – <datum>" in CHANGELOG.md; de tekst gaat mee in de release
          awk -v v="$V" 'index($0, "## " v " ")==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Geen sectie '## $V – <datum>' in CHANGELOG.md. Voeg release notes toe voor $V."; exit 1
          fi
          if ! grep -q "releases/download/app-v$V/trajectcontrole-$V.apk" notes.md; then
            echo "::error::De sectie voor $V in CHANGELOG.md mist de APK-link (releases/download/app-v$V/trajectcontrole-$V.apk)."; exit 1
          fi
          cat notes.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK bouwen
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Versie bepalen
        id: v
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "versie=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "trajectcontrole-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: trajectcontrole-${{ steps.v.outputs.versie }}
          path: trajectcontrole-${{ steps.v.outputs.versie }}.apk
      - name: Release (laatste APK)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versie }}
        run: |
          printf '\n---\nAutomatisch gebouwd uit main (%s). Installeer via UnknownAuto. Alle versies: CHANGELOG.md\n' "$GITHUB_SHA" >> notes.md
          # vaste release per versie (voor de link in CHANGELOG.md); bij een herbouw van dezelfde versie vervangen
          gh release delete "app-v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "app-v$V" "trajectcontrole-$V.apk" --title "App $V" --notes-file notes.md --latest=false
          gh release delete "app-laatste" --yes --cleanup-tag 2>/dev/null || true
          gh release create "app-laatste" "trajectcontrole-$V.apk" --title "App $V (laatste build)" \
            --notes-file notes.md --latest
