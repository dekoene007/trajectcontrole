name: URL ophalen (hulpmiddel)

# Manueel hulpmiddel: haalt een publieke URL op (enkel lezen) en toont de inhoud in de log.
# Gebruikt om open-databronnen (bv. AWV-kaartlagen) te onderzoeken.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Publieke URL (http/https)"
        required: true
      max_kb:
        description: "Maximaal te tonen kB"
        required: false
        default: "800"

permissions:
  contents: read

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ophalen
        env:
          U: ${{ inputs.url }}
          MAX: ${{ inputs.max_kb }}
        run: |
          case "$U" in http://*|https://*) ;; *) echo "geen http(s)-URL"; exit 1;; esac
          curl -sS -L --max-time 120 -A "trajectcontrole-onderzoek (github.com/dekoene007/trajectcontrole)" \
               -D headers.txt -o body.bin "$U"
          echo "HEADERS_BEGIN"; cat headers.txt; echo "HEADERS_EINDE"
          echo "GROOTTE $(wc -c < body.bin) bytes"
          echo "INHOUD_BEGIN"; head -c $((MAX*1024)) body.bin | tr -d '\r'; echo; echo "INHOUD_EINDE"
