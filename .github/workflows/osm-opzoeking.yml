name: OSM-opzoeking (hulpmiddel)

# Manueel hulpmiddel: voert een Overpass-query uit en toont het resultaat in de log.
# Gebruikt om eigen trajecten (data/eigen_trajecten.tsv) op de juiste weg te leggen.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Overpass QL-query (uitvoer [out:json])"
        required: true

permissions:
  contents: read

jobs:
  opzoeking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Overpass
        env:
          Q: ${{ inputs.query }}
        run: |
          for EP in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "probeer $EP"
            if curl -sS --max-time 120 -A "trajectcontrole-pipeline (github.com/dekoene007/trajectcontrole)" \
                 --data-urlencode "data=$Q" "$EP" -o resultaat.json && python3 -c "import json;json.load(open('resultaat.json'))['elements']" 2>/dev/null; then
              break
            fi
          done
          python3 -c "import json;d=json.load(open('resultaat.json'));print('ELEMENTEN',len(d['elements']));print('RESULTAAT_BEGIN');print(json.dumps(d,separators=(',',':')));print('RESULTAAT_EINDE')"
